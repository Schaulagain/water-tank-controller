# Copy .env.example to .env, then:
#   docker compose up -d --build
#   docker compose exec app php artisan user:create you@example.com
# and open http://<this machine>:8000

x-app: &app
  image: water-tank-app
  pull_policy: never
  restart: unless-stopped
  volumes:
    - app-data:/data
  environment:
    APP_URL: ${APP_URL:-http://localhost:8000}
    APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kathmandu}
    BROADCAST_CONNECTION: reverb
    REVERB_APP_ID: ${REVERB_APP_ID:-water}
    REVERB_APP_KEY: ${REVERB_APP_KEY:-water-key}
    REVERB_APP_SECRET: ${REVERB_APP_SECRET:-change-me}
    REVERB_HOST: reverb
    REVERB_PORT: 6001
    REVERB_SCHEME: http
    REVERB_SERVER_PORT: 6001
    REVERB_PUBLIC_PORT: ${REVERB_PUBLIC_PORT:-6001}
    MQTT_HOST: mosquitto
    MQTT_PORT: 1883
    MQTT_TOPIC: ${MQTT_TOPIC:-home/water}
    SIMULATOR_ENABLED: ${SIMULATOR_ENABLED:-true}
    NTFY_URL: ${NTFY_URL:-https://ntfy.sh}
    NTFY_TOPIC: ${NTFY_TOPIC:-}

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"         # the ESP32 connects here
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3"]
      interval: 10s
      retries: 5

  app:
    <<: *app
    build: ./server
    pull_policy: build
    ports:
      - "8000:8000"         # the web page
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/up"]
      interval: 10s
      retries: 10
    depends_on:
      mosquitto:
        condition: service_healthy

  reverb:
    <<: *app
    command: ["reverb:start", "--host=0.0.0.0", "--port=6001"]
    ports:
      - "${REVERB_PUBLIC_PORT:-6001}:6001"   # live updates for the page
    depends_on:
      app:
        condition: service_healthy

  listener:
    <<: *app
    command: ["device:listen"]
    depends_on:
      app:
        condition: service_healthy
      reverb:
        condition: service_started

  scheduler:
    <<: *app
    command: ["schedule:work"]
    depends_on:
      app:
        condition: service_healthy

  simulator:
    build: ./simulator
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_TOPIC: ${MQTT_TOPIC:-home/water}
      SIM_SPEED: ${SIM_SPEED:-10}
    depends_on:
      mosquitto:
        condition: service_healthy

volumes:
  app-data:
  mosquitto-data:
